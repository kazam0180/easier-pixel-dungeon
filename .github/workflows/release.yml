name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Linux & Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Android SDK root
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-${{ hashFiles('build.gradle', 'android/build.gradle') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            VERSION=$(sed -n "s/^[[:space:]]*appVersionName[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" build.gradle)
            echo "RELEASE_TAG=${VERSION}@$(date +%Y.%m.%d)" >> "$GITHUB_ENV"
          fi
          echo "Building release for tag: ${RELEASE_TAG}"

      - name: Require Android signing credentials
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required to produce a signed release APK. Add it to the repository secrets and retry."
            exit 1
          fi

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Android release APK & AAB
        run: ./gradlew :android:assembleRelease :android:bundleRelease --no-daemon

      - name: Verify Android APK is signed
        run: |
          APK=$(ls android/build/outputs/apk/release/*.apk | head -n1)
          echo "Verifying signature of: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS"/apksigner verify --print-certs "$APK"

      - name: Build Linux desktop release JAR
        run: ./gradlew :desktop:release --no-daemon

      - name: Build Linux desktop executable (jpackage)
        run: ./gradlew :desktop:jpackageImage --no-daemon

      - name: Package Linux executables
        run: |
          cd desktop/build/jpackage
          zip -r "Easier Pixel Dungeon Linux.zip" "Easier Pixel Dungeon"

      - name: Build Linux AppImage
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            archlinux:latest \
            bash /work/.github/scripts/build-appimage.sh

      - name: Gather release artifacts
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/*.apk dist/
          cp android/build/outputs/bundle/release/*.aab dist/
          cp desktop/build/libs/*.jar dist/
          cp "desktop/build/jpackage/Easier Pixel Dungeon Linux.zip" dist/
          for f in "$GITHUB_WORKSPACE"/*.AppImage "$GITHUB_WORKSPACE"/*.zsync; do
            cp "$f" dist/
          done
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          files: dist/*

